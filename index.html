function query(action,fields,apiUrl=API_URL){return new Promise((resolve,reject)=>{let q='jjcb_'+Date.now()+'_'+(++seq),s=document.createElement('script'),done=false;let timer=setTimeout(()=>finish(Error('O servidor demorou a responder. Clique em Atualizar dados.')),30000);function finish(err,val){if(done)return;done=true;clearTimeout(timer);delete window[q];s.remove();err?reject(err):resolve(val);}window[q]=obj=>obj?.erro?finish(Error(obj.erro)):finish(null,obj);s.onerror=()=>finish(Error('Falha ao acessar a API do Apps Script.'));s.src=apiUrl+'?'+new URLSearchParams({action,callback:q,...fields}).toString();document.head.appendChild(s);});}
async function refresh(){const rid=++reqNum;el('main').innerHTML='<div class="loading"><span class="spinner"></span>Atualizando dados do projeto…</div>';try{let x=await query('jj_resumo',{});if(rid!==reqNum)return;D=x;if(!Array.isArray(D.turmas)||!Array.isArray(D.fichas))throw Error('Formato inesperado da resposta.');render();}catch(err){if(rid===reqNum)error(err);}}
function render(){if(!D)return;const fn={dashboard:dashboard,territorios:territorios,atividades:atividades,galeria:galeria,pendencias:pendencias,metas:metas,drive:drive};(fn[P.page]||dashboard)();}
function lookup(){return new Map(D.fichas.map(f=>[f.id,f]));}
function areas(){return [...new Set(D.turmas.map(t=>t.territorio))].sort((a,b)=>a.localeCompare(b,'pt-BR'));}
function relevantTurmas(){return D.turmas.filter(t=>(!P.territorio||t.territorio===P.territorio)&&(!P.modalidade||t.modalidade===P.modalidade)&&(!P.busca||norm(t.turma+' '+t.territorio+' '+t.modalidade).includes(norm(P.busca))));}
function otherReview(territorio){return D.fichas.filter(f=>f.turma==='SEM TURMA CONFIRMADA'&&(!territorio||f.territorio===territorio)&&f.total>0);}
function dashboard(){let c=D.contadores||{},no=D.fichas.filter(f=>f.total===0&&f.turma!=='SEM TURMA CONFIRMADA').length,review=otherReview('').reduce((s,f)=>s+n(f.total),0);
let html=head('Central de Monitoramento','Acompanhe o projeto sem abrir pastas, planilhas ou códigos')+statusBand();
html+='<div class="statgrid">'+stat(c.nucleos||areas().length,'Territórios com turmas')+stat(c.turmas||D.turmas.length,'Turmas planejadas')+stat(c.arquivos||0,'Arquivos inventariados')+stat(c.fotos||0,'Fotografias cadastradas')+'</div>';
html+='<div class="section">Como encontrar uma evidência</div><div class="step-row">'+[['01','Escolha o território','Selecione o local da atividade.'],['02','Selecione a modalidade','Ginástica, futebol, dança e outras.'],['03','Encontre a turma','Confira o horário e os arquivos.'],['04','Abra a ficha','Veja fotos e documentos por categoria.']].map(x=>'<div class="step-card"><span class="step-n">ETAPA '+x[0]+'</span><strong>'+x[1]+'</strong><p>'+x[2]+'</p></div>').join('')+'</div><div style="margin:16px 0"><button class="btn gold" data-nav="galeria">Explorar galeria e fichas →</button></div>';
html+='<div class="section">Atenção do monitoramento</div><div class="grid3"><div class="tile"><span class="pill warnpill">Precisam de conferência</span><h3>Arquivos sem turma confirmada</h3><p class="muted">'+review+' arquivo(s) classificados provisoriamente. Não misturar com a documentação das turmas.</p><button class="btn soft small" data-nav="pendencias">Consultar revisões →</button></div><div class="tile"><span class="pill">Sem inventário associado</span><h3>Turmas sem arquivos encontrados</h3><p class="muted">'+no+' ficha(s) ainda sem arquivos indexados. Isso não significa que a atividade não ocorreu.</p><button class="btn soft small" data-nav="atividades">Ver turmas →</button></div><div class="tile"><span class="pill cyan">Atualização automática</span><h3>Documentos e fotos no Drive</h3><p class="muted">A busca de novas evidências ocorre pelo Apps Script. O painel apresenta o que já foi inventariado.</p><button class="btn soft small" data-nav="galeria">Abrir galeria →</button></div></div>';
view(html);}

html+='<div class="grid4">'+areas().map(name=>{let t=D.turmas.filter(x=>x.territorio===name),docs=t.reduce((sum,x)=>sum+n(by.get(x.id)?.total),0),rev=otherReview(name).reduce((sum,x)=>sum+n(x.total),0);return '<button class="territory-card" data-area="'+esc(name)+'"><div class="icon-circle">⌖</div><h3>'+esc(name)+'</h3><div class="fact">'+t.length+' turma(s) · '+docs+' arquivos vinculados</div><div class="pills" style="margin-top:9px">'+pill([...new Set(t.map(x=>x.modalidade))].length+' modalidades')+(rev?pill(rev+' para revisão','warnpill'):'')+'</div><div class="cardbottom">Ver modalidades <span>→</span></div></button>';}).join('')+'</div>';view(html);document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{P.territorio=b.dataset.area;P.modalidade='';P.step=2;setPage('galeria');});}
function crumbs(){let a='<div class="crumbs"><button data-step="1">Todos os territórios</button>';if(P.territorio)a+='<span>›</span><button data-step="2">'+esc(P.territorio)+'</button>';if(P.modalidade)a+='<span>›</span><strong>'+esc(P.modalidade)+'</strong>';return a+'</div>';}

html+='<div class="pills" style="margin:0 0 8px">'+pill('1 · Território',P.step===1?'cyan':'')+pill('2 · Modalidade',P.step===2?'cyan':'')+pill('3 · Turma',P.step>=3?'cyan':'')+pill('4 · Ficha')+'</div>'+crumbs()+galleryIntro();let map=lookup();
if(P.step===1||!P.territorio){html+='<div class="section">Selecione um território</div><div class="grid4">'+areas().map(area=>{let ts=D.turmas.filter(t=>t.territorio===area),total=ts.reduce((s,t)=>s+n(map.get(t.id)?.total),0);return '<button class="territory-card" data-area="'+esc(area)+'"><div class="icon-circle">⌖</div><h3>'+esc(area)+'</h3><div class="fact">'+ts.length+' turmas · '+total+' arquivos</div><div class="cardbottom">Ver modalidades <span>→</span></div></button>';}).join('')+'</div>';}
else if(P.step===2||!P.modalidade){let ts=D.turmas.filter(t=>t.territorio===P.territorio),mods=[...new Set(ts.map(t=>t.modalidade))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
html+='<div class="section">Modalidades de '+esc(P.territorio)+'</div><div class="grid3">'+mods.map(mod=>{let list=ts.filter(t=>t.modalidade===mod),total=list.reduce((s,t)=>s+n(map.get(t.id)?.total),0);return '<button class="sport-card" data-mod="'+esc(mod)+'"><div class="icon-circle">'+esc(ICONS[mod]||'◎')+'</div><h3>'+esc(mod)+'</h3><div class="fact">'+list.length+' turma(s) · '+total+' arquivo(s)</div><div class="cardbottom">Selecionar modalidade <span>→</span></div></button>';}).join('')+'</div>';}
else {let ts=relevantTurmas();html+='<div class="section">Turmas de '+esc(P.modalidade)+' · '+esc(P.territorio)+'</div><div class="toolbar"><input id="search" placeholder="Buscar turma ou horário" value="'+esc(P.busca)+'" aria-label="Pesquisar turmas"><label class="tiny"><input type="checkbox" id="onlyFiles" '+(P.onlyFiles?'checked':'')+'> Somente com arquivos</label><button class="btn linebtn small" data-step="2">← Trocar modalidade</button></div>';
let filtered=ts.filter(t=>!P.onlyFiles||n(map.get(t.id)?.total)>0);html+='<div class="grid3">'+filtered.map(t=>{let f=map.get(t.id)||{total:0,fotos:0,diarios:0,ponto:0,listas:0};return '<article class="class-card"><div class="pills">'+pill(t.id)+(n(f.total)?pill('Com arquivos','ok'):pill('Não inventariada','warnpill'))+'</div><h3>'+esc(t.turma)+'</h3><div class="class-meta">'+esc(t.horario||'Horário não informado')+'</div><div class="countrow">'+pill(n(f.fotos)+' fotos')+pill(n(f.diarios)+' diários')+pill(n(f.ponto)+' folhas de ponto')+pill(n(f.total)+' arquivos')+'</div><div class="actions"><span class="tiny muted">'+esc(t.modalidade)+'</span><button class="btn small" data-open="'+esc(t.id)+'">Abrir ficha →</button></div></article>';}).join('')+'</div>'+(filtered.length?'':'<div class="empty">Nenhuma turma encontrada. Limpe os filtros.</div>');}
view(html);document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{P.territorio=b.dataset.area;P.modalidade='';P.step=2;render();});document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{P.modalidade=b.dataset.mod;P.step=3;P.busca='';render();});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{let st=n(b.dataset.step);P.step=st;if(st<=1){P.territorio='';P.modalidade='';}if(st===2)P.modalidade='';P.busca='';render();});let search=el('search');if(search)search.oninput=()=>{P.busca=search.value;render();el('search')?.focus();};let only=el('onlyFiles');if(only)only.onchange=()=>{P.onlyFiles=only.checked;render();};document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{P.page='pendencias';render();});}
function atividades(){const map=lookup();let ts=relevantTurmas();let html=head('Atividades e Turmas','Planejamento da turma, horário, situação declarada e documentos localizados')+statusBand();html+='<div class="toolbar"><select id="areaSelect"><option value="">Todos os territórios</option>'+areas().map(a=>'<option value="'+esc(a)+'" '+(P.territorio===a?'selected':'')+'>'+esc(a)+'</option>').join('')+'</select><input id="search" placeholder="Pesquisar turma, modalidade ou horário" value="'+esc(P.busca)+'"><button class="btn linebtn small" id="clear">Limpar filtros</button></div>';
html+='<div class="panel table-scroll" style="padding:0"><table class="tbl"><thead><tr><th>Território</th><th>Turma / modalidade</th><th>Diário declarado</th><th>Fotografias</th><th>Arquivos encontrados</th><th>Ficha</th></tr></thead><tbody>'+ts.map(t=>{let f=map.get(t.id)||{},v=t.diario||'Sem informação';return '<tr><td>'+esc(t.territorio)+'</td><td><strong>'+esc(t.turma)+'</strong><br><small class="muted">'+esc(t.modalidade)+' · '+esc(t.horario)+'</small></td><td>'+pill(v,v==='Completo'?'ok':'warnpill')+'</td><td>'+pill(n(f.fotos)+' no inventário')+'</td><td><strong>'+n(f.total)+'</strong></td><td><button class="btn small" data-open="'+esc(t.id)+'">Abrir ficha</button></td></tr>';}).join('')+'</tbody></table></div>';view(html);el('areaSelect').onchange=e=>{P.territorio=e.target.value;render();};el('search').onchange=e=>{P.busca=e.target.value;render();};el('search').onkeydown=e=>{if(e.key==='Enter'){P.busca=e.target.value;render();}};el('clear').onclick=()=>{P.territorio='';P.busca='';P.modalidade='';render();};}
function pendencias(){let map=lookup(),rows=[];D.turmas.forEach(t=>{let a=[];if(t.diario==='Pendente')a.push('Diário informado como pendente');if(t.ponto==='Pendente')a.push('Folha de ponto informada como pendente');if(t.fotos==='Pendente')a.push('Fotografia informada como pendente');if(t.videos==='Pendente')a.push('Vídeo informado como pendente');if(a.length)rows.push({t,a,f:map.get(t.id)||{}});});let review=otherReview(P.territorio);
let html=head('Pendências e Conferência','Organização simples para encontrar o que precisa de atenção')+statusBand();html+='<div class="warn">Situações de “Pendente” vêm da aba ATIVIDADES e podem estar desatualizadas. Quando o arquivo já existe no Drive, o responsável deve conferir sua correspondência, sem presumir que a atividade não ocorreu.</div><div class="section">Arquivos ainda sem turma confirmada</div><div class="grid3">'+review.map(f=>'<article class="tile"><div class="pills">'+pill('Em revisão','warnpill')+pill(n(f.total)+' arquivos')+'</div><h3>'+esc(f.territorio||'Território a confirmar')+' · '+esc(f.modalidade||'Modalidade a confirmar')+'</h3><p class="tiny muted">'+n(f.fotos)+' fotos · vínculo documental em análise</p><button class="btn small" data-open="'+esc(f.id)+'">Consultar ficha →</button></article>').join('')+'</div>'+(review.length?'':'<div class="empty">Nenhuma ficha de revisão com este filtro.</div>');
html+='<div class="section">Situações a conferir nas turmas</div><div class="panel table-scroll" style="padding:0"><table class="tbl"><thead><tr><th>Território</th><th>Turma</th><th>Registro da planilha</th><th>Arquivos no Drive</th><th>Ficha</th></tr></thead><tbody>'+rows.map(({t,a,f})=>'<tr><td>'+esc(t.territorio)+'</td><td><strong>'+esc(t.turma)+'</strong></td><td>'+esc(a.join(' · '))+'</td><td>'+n(f.total)+'</td><td><button class="btn small" data-open="'+esc(t.id)+'">Conferir</button></td></tr>').join('')+'</tbody></table></div>';view(html);}
function metas(){let html=head('Metas e Indicadores','Quantidades pactuadas e informações registradas na planilha oficial')+statusBand();html+='<div class="grid3">'+D.metas.map(m=>'<article class="tile"><span class="pill cyan">'+esc(m.codigo)+'</span><h3>'+esc(m.descricao)+'</h3><div class="pills">'+pill('Previsto: '+(m.previsto||'Não informado'))+pill('Realizado informado: '+(m.realizado||'Não informado'))+'</div></article>').join('')+'</div>';view(html);}
function drive(){let html=head('Pastas do Drive','Fontes originais do monitoramento, sem mover ou alterar arquivos')+statusBand();html+='<div class="panel"><h3 style="margin:0 0 10px;color:var(--navy)">Acervo oficial do projeto</h3><p class="muted">A varredura inclui as pastas de turmas, evidências extraídas e documentos em revisão. O Drive conserva as permissões originais de acesso.</p><a class="btn" target="_blank" rel="noopener noreferrer" href="'+ROOT_DRIVE+'">Abrir pasta principal no Drive ↗</a></div><div class="section">Localize a pasta pela turma</div><button class="btn soft" data-nav="galeria">Escolher território e turma →</button>';view(html);}
function openFicha(id){let f=D.fichas.find(x=>x.id===id),t=D.turmas.find(x=>x.id===id);if(!f&&t)f={...t,total:0,fotos:0,diarios:0,ponto:0,listas:0,relatorios:0};if(!f)return;
F={id:id,tipo:'TODOS',page:1};let title=f.turma==='SEM TURMA CONFIRMADA'?'Evidências em revisão':f.turma;el('drawerTitle').textContent=title+' · '+(f.territorio||'Território a confirmar');el('drawerSubtitle').textContent=(f.modalidade||'Modalidade a conferir')+' · '+f.id;let vals=[['Arquivos localizados',f.total],['Fotos',f.fotos],['Diários',f.diarios],['Folhas de ponto',f.ponto],['Listas',f.listas],['Relatórios',f.relatorios],['Inscrições',f.inscricoes],['Vídeos',f.videos]];

el('docTabs').innerHTML=CATEGORIES.map(([tipo,label,key])=>{let count=key?n(f[key]):null;return '<button role="tab" aria-selected="'+(F.tipo===tipo?'true':'false')+'" data-cat="'+tipo+'">'+esc(label)+(count===null?'':' · '+count)+'</button>';}).join('');el('overlay').classList.add('on');document.body.style.overflow='hidden';el('drawerTitle').focus?.();wireTabs();loadFiles();}

function jjAcessoDocumentalHtml(){
 const ficha=D.fichas.find(x=>x.id===F.id)||{};
 const turma=D.turmas.find(x=>x.id===F.id)||{};
 const link=validUrl(ficha.url||turma.url||'');
 const total=n(ficha.total), fotos=n(ficha.fotos), videos=n(ficha.videos);
 const documentos=Math.max(0,total-fotos-videos);
 const names={'DIARIO_DE_CLASSE':'Diários de classe','FOLHA_DE_PONTO':'Folhas de ponto',
 'LISTA_PRESENCA':'Listas de presença','LISTA_DE_INSCRITOS':'Listas de inscritos',
 'FICHA_INSCRICAO':'Fichas de inscrição','RELATORIO':'Relatórios','DECLARACAO':'Declarações',
 'CERTIFICADO':'Certificados','TERMO':'Termos','OUTRO_DOCUMENTO':'Outros documentos',
 'TIPO_NAO_IDENTIFICADO':'Não identificados','OUTRO':'Outras evidências'};
 const all=F.tipo==='TODOS';
 const label=all?'Documentos e registros da turma':(names[F.tipo]||'Evidências documentais');
 let count='';
 if(all)count=documentos+' arquivo(s) documentais inventariados nesta ficha';
 else if(F.tipo==='DIARIO_DE_CLASSE')count=n(ficha.diarios)+' diário(s) cadastrado(s)';
 else if(F.tipo==='FOLHA_DE_PONTO')count=n(ficha.ponto)+' folha(s) de ponto cadastrada(s)';
 else if(F.tipo==='LISTA_PRESENCA')count=n(ficha.listas)+' lista(s) registrada(s)';
 else if(F.tipo==='RELATORIO')count=n(ficha.relatorios)+' relatório(s) cadastrado(s)';
 else if(F.tipo==='FICHA_INSCRICAO')count=n(ficha.inscricoes)+' inscrição(ões) cadastrado(s)';
 else count='Arquivos e classificação disponíveis na pasta de evidências';
 return '<section class="jj-doc-access" aria-label="Acesso às evidências documentais">'+
  '<div><div class="eyebrow">Acervo documental preservado</div><h3>'+esc(label)+'</h3><p>'+esc(count)+
  '. Os originais estão organizados no Google Drive e não são apagados ou excluídos do inventário. '+
  'A abertura de documentos com nomes, frequência ou assinaturas depende da permissão do Drive.</p></div>'+
  (link?'<a class="btn gold" href="'+link+'" target="_blank" rel="noopener noreferrer">📂 Abrir evidências no Drive ↗</a>':
   '<span class="tiny">Pasta da turma ainda sem link confirmado.</span>')+'</section>';
}
const JJ_DOC_LABEL={DIARIO_DE_CLASSE:'Diário de classe',FOLHA_DE_PONTO:'Folha de ponto',LISTA_PRESENCA:'Lista de presença',LISTA_DE_INSCRITOS:'Lista de inscritos',FICHA_INSCRICAO:'Ficha de inscrição',RELATORIO:'Relatório',DECLARACAO:'Declaração',CERTIFICADO:'Certificado',TERMO:'Termo',OUTRO_DOCUMENTO:'Outro documento',OUTRO:'Outro arquivo',TIPO_NAO_IDENTIFICADO:'Arquivo a conferir'};
function jjPastaSegura(){
 const f=D.fichas.find(x=>x.id===F.id)||{},t=D.turmas.find(x=>x.id===F.id)||{};
 return validUrl(f.url||t.url||'');
}
function jjContarDocumentos(tipo){
 const f=D.fichas.find(x=>x.id===F.id)||{};
 const mapping={DIARIO_DE_CLASSE:'diarios',FOLHA_DE_PONTO:'ponto',LISTA_PRESENCA:'listas',FICHA_INSCRICAO:'inscricoes',RELATORIO:'relatorios'};
 const key=mapping[tipo];
 if(key)return n(f[key]);
 if(tipo==='TODOS')return Math.max(0,n(f.total)-n(f.fotos)-n(f.videos));
 return 0;
}

  const label=JJ_DOC_LABEL[a.tipo]||'Evidência documental',idOk=/^[A-Za-z0-9_-]{10,}$/.test(a.id||'');

  return '<article class="jj-doc-card"><button class="jj-doc-preview" data-doc-preview="'+(offset+i)+'" aria-label="Visualizar '+esc(label)+'">'+
   (thumb?'<img loading="lazy" alt="Prévia do documento" src="'+esc(thumb)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">':'')+
   '<span class="jj-doc-fallback" style="'+(thumb?'display:none':'')+'">▤<br>Prévia indisponível<br>Abrir documento</span>'+
   '<span class="jj-doc-tag">'+esc(label)+'</span></button><div class="jj-doc-meta"><strong>'+esc(a.nome||label)+'</strong><small>'+esc(a.alterado||'Arquivo inventariado')+'</small>'+
   '<div class="actions"><button class="btn soft small" data-doc-preview="'+(offset+i)+'">Visualizar</button>'+
   '<a class="btn linebtn small" href="'+validUrl(a.url)+'" target="_blank" rel="noopener noreferrer">Original ↗</a></div></div></article>';
 }).join('')+'</div>';
}
function jjDocumentoAguardandoAcesso(tipo,msg){
 const nDocs=jjContarDocumentos(tipo),path=jjPastaSegura(),label=JJ_DOC_LABEL[tipo]||'Documentos da turma';
 let info='<div class="jj-doc-protected"><strong>Documentos encontrados: '+nDocs+'</strong>'+esc(msg)+
 '<p style="margin:8px 0 0">Assim como no Conexões Criativas, as prévias verdadeiras são exibidas após a autenticação do Google. Arquivos e vínculos continuam preservados.</p>'+
 (path?'<a class="btn soft small" style="margin-top:10px" target="_blank" rel="noopener noreferrer" href="'+path+'">Abrir pasta no Drive ↗</a>':'')+'</div>';
 if(!nDocs)return info;
 // Cartões de categoria, sem IDs, nomes de crianças nem arquivos pessoais expostos na página pública.
 const count=Math.min(nDocs,30);
 let cards=Array.from({length:count},(_,i)=>'<article class="jj-doc-card"><div class="jj-doc-preview" style="cursor:default"><span class="jj-doc-fallback">▤<br>'+esc(label)+' '+(i+1)+'<br><small>Acesso Google necessário</small></span></div><div class="jj-doc-meta"><strong>'+esc(label)+' '+(i+1)+'</strong><small>Original preservado na pasta da turma</small></div></article>').join('');
 return info+'<div class="jj-doc-grid">'+cards+'</div>'+(nDocs>count?'<p class="tiny muted">Mostrando '+count+' de '+nDocs+' registros. A consulta autenticada apresenta todos por páginas.</p>':'');
}
function jjWireDocs(){document.querySelectorAll('[data-doc-preview]').forEach(b=>b.onclick=()=>openPreview(n(b.dataset.docPreview)));}
async function jjCarregarDocs(tipo,pg){
 if(!API_DOCUMENTOS_SEGUROS || !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_DOCUMENTOS_SEGUROS))
    throw Error('A galeria documental autenticada ainda não foi conectada.');
 return query('jj_docs',{ficha:F.id,tipo,pagina:String(pg)},API_DOCUMENTOS_SEGUROS);
}
async function loadFiles(){
 const key=F.id+'|'+F.tipo+'|'+F.page;
 el('fileResult').innerHTML='<div class="loading"><span class="spinner"></span>Consultando as evidências desta ficha…</div>';
 el('filePager').innerHTML=''; lastFiles=[];
 const isMedia=F.tipo==='FOTO'||F.tipo==='VIDEO';
 const isAll=F.tipo==='TODOS';
 if(!isMedia && !isAll){
   try{
     const data=await jjCarregarDocs(F.tipo,F.page);
     if(F.id+'|'+F.tipo+'|'+F.page!==key)return;
     lastFiles=Array.isArray(data.itens)?data.itens:[];
     const head='<div class="noticebox"><strong>'+n(data.total)+' arquivo(s) de '+esc(JJ_DOC_LABEL[F.tipo]||'evidência')+'</strong> acessíveis à conta Google autorizada.</div>';
     el('fileResult').innerHTML=head+(lastFiles.length?jjMiniaturasDocumentos(lastFiles):'<div class="empty">Nenhum documento localizado nesta categoria.</div>');
     jjWireDocs();jjPagerDocs(n(data.paginas)||1);
   }catch(err){if(F.id+'|'+F.tipo+'|'+F.page===key){el('fileResult').innerHTML=jjDocumentoAguardandoAcesso(F.tipo,err.message);}}
   return;
 }
 // Fotos e vídeos aprovados permanecem visíveis publicamente; documentos são adicionados apenas quando Google autentica.
 try{
   const media=await query('jj_arquivos',{ficha:F.id,tipo:F.tipo,pagina:String(F.page)});
   if(F.id+'|'+F.tipo+'|'+F.page!==key)return;
   const publicMedia=Array.isArray(media.itens)?media.itens:[];
   lastFiles=publicMedia;
   const total=n(media.totalInventariado??media.total),approved=n(media.totalAutorizado??media.total);
   let head='<div class="noticebox" style="margin:0 0 13px"><strong>'+total+' arquivo(s) inventariado(s)</strong> nesta categoria · '+approved+' autorizado(s) para exibição pública.</div>';
   let cards=publicMedia.map((a,i)=>{let isPhoto=a.tipo==='FOTO'&&/^[\w-]{8,}$/.test(a.id),isVideo=a.tipo==='VIDEO'&&/^[\w-]{8,}$/.test(a.id),thumb=(isPhoto||isVideo)?'https://drive.google.com/thumbnail?id='+encodeURIComponent(a.id)+'&sz=w500':'';return '<article class="media"><div class="imagebox" data-preview="'+i+'">'+(thumb?'<img loading="lazy" alt="Prévia da evidência autorizada" src="'+esc(thumb)+'" onerror="this.style.display=\'none\'">':'<span>▤</span>')+(isVideo?'<span class="video-play-icon" aria-hidden="true">▶</span>':'')+'</div><div class="media-body"><strong>'+esc(a.nome)+'</strong><small>'+esc(a.alterado||'')+' · '+esc(a.status||'Autorizado')+'</small><div class="actions"><button class="btn soft small" data-preview="'+i+'">Visualizar</button><a class="btn small linebtn" target="_blank" rel="noopener noreferrer" href="'+validUrl(a.url)+'">Drive ↗</a></div></div></article>';}).join('');
   let html=head+(cards?'<div class="medialist">'+cards+'</div>':'<div class="empty">Nenhuma mídia liberada nesta categoria.</div>');
   if(isAll){
     html+='<div class="section" style="margin-top:20px">Diários, listas e demais evidências documentais</div>';
     try{
       const docs=await jjCarregarDocs('TODOS',F.page);
       if(F.id+'|'+F.tipo+'|'+F.page!==key)return;
       const items=Array.isArray(docs.itens)?docs.itens:[];
       const offset=lastFiles.length;lastFiles=lastFiles.concat(items);
       html+='<div class="jj-doc-protected"><strong>'+n(docs.total)+' documentos</strong> Consulta autenticada. Clique na miniatura para ampliar, navegar e abrir o original.</div>'+
            (items.length?jjMiniaturasDocumentos(items,offset):'<div class="empty">Nenhum documento adicional nesta página.</div>');
     }catch(err){html+=jjDocumentoAguardandoAcesso('TODOS',err.message);}
   }
   el('fileResult').innerHTML=html;
   document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>openPreview(n(b.dataset.preview)));
   jjWireDocs();
   // Na aba Todos, a paginação percorre mídias; a navegação por tipo permite percorrer todos os documentos.
   const pageCount=n(media.paginas)||1;
   el('filePager').innerHTML='<span class="tiny muted">Página '+F.page+' de '+pageCount+' · '+approved+' mídias aprovadas</span><div class="pills"><button class="btn small linebtn" id="pagePrev" '+(F.page<=1?'disabled':'')+'>Anterior</button><button class="btn small" id="pageNext" '+(F.page>=pageCount?'disabled':'')+'>Próxima</button></div>';
   el('pagePrev').onclick=()=>{F.page--;loadFiles()};el('pageNext').onclick=()=>{F.page++;loadFiles()};
 }catch(err){if(F.id+'|'+F.tipo+'|'+F.page===key)el('fileResult').innerHTML='<div class="warn">Não foi possível carregar as mídias: '+esc(err.message)+'</div>';}
}
function jjPagerDocs(pages){
 el('filePager').innerHTML='<span class="tiny muted">Página '+F.page+' de '+pages+'</span><div class="pills"><button class="btn small linebtn" id="pagePrev" '+(F.page<=1?'disabled':'')+'>Anterior</button><button class="btn small" id="pageNext" '+(F.page>=pages?'disabled':'')+'>Próxima</button></div>';
 el('pagePrev').onclick=()=>{F.page--;loadFiles()};el('pageNext').onclick=()=>{F.page++;loadFiles()};
}
function openPreview(i){previewIndex=i;showPreview();el('preview').classList.add('on');}
function showPreview(){let a=lastFiles[previewIndex];if(!a)return;el('previewName').textContent=a.nome;el('previewPosition').textContent=(previewIndex+1)+' de '+lastFiles.length;el('previewOriginal').href=validUrl(a.url)||'#';if(a.tipo==='FOTO'){el('previewContent').innerHTML='<img alt="Fotografia da atividade" src="https://drive.google.com/thumbnail?id='+encodeURIComponent(a.id)+'&sz=w1600">';}else{el('previewContent').innerHTML='<iframe title="Vídeo ou documento autorizado" allow="autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin" src="https://drive.google.com/file/d/'+encodeURIComponent(a.id)+'/preview"></iframe>';}}
function closePreview(){el('preview').classList.remove('on');el('previewContent').innerHTML='';}
function closeFicha(){closePreview();el('overlay').classList.remove('on');document.body.style.overflow='';}
el('closeDrawer').onclick=closeFicha;el('overlay').onclick=e=>{if(e.target.id==='overlay')closeFicha();};el('closePreview').onclick=closePreview;el('previewPrev').onclick=()=>{if(previewIndex>0){previewIndex--;showPreview();}};el('previewNext').onclick=()=>{if(previewIndex<lastFiles.length-1){previewIndex++;showPreview();}};el('preview').onclick=e=>{if(e.target.id==='preview')closePreview();};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(el('preview').classList.contains('on'))closePreview();else closeFicha();}});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{P.territorio='';P.modalidade='';P.step=1;setPage(b.dataset.page);});refresh();

</script></body></html>
