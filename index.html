<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogando Juntos pela Cidadania | Instituto BR Arte</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap');
:root{
  --az:#092040;--azs:#00B7D7;--am:#ECC203;--cz:#EFF1F3;--aze:#021738;
  --verde:#0B6B3A;--verdebg:#D9F2E6;--amarelo:#8A6D00;--amarelobg:#FFF3CD;--verm:#B00020;--vermbg:#FBE1E1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',Arial,sans-serif;background:var(--cz);color:var(--az);min-height:100vh}
h1,h2,h3{font-family:'Montserrat',Arial,sans-serif}

/* TELA DE SENHA */
#pwd{position:fixed;inset:0;background:var(--az);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:99}
.pbox{background:#fff;border-radius:16px;padding:40px 32px;max-width:360px;width:90%;text-align:center;display:flex;flex-direction:column;gap:14px}
.plogo-chip img{max-height:80px;object-fit:contain}
.psub2{font-size:13px;color:#666}
.phint{font-size:11px;color:#999}
.pin{padding:12px 14px;border-radius:8px;border:1.5px solid #ddd;font-size:14px}
.pbtn{background:var(--azs);color:#fff;border:none;border-radius:8px;padding:12px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer}
.perr{color:#c0392b;font-size:12px;min-height:14px}
.pfoot-logo{height:26px;object-fit:contain;filter:brightness(0) invert(1);opacity:.7}

/* LOADING */
#ld{position:fixed;inset:0;background:var(--cz);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:98}
.spin{width:36px;height:36px;border:4px solid #ddd;border-top-color:var(--azs);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ltxt{font-size:13px;color:#666}

/* APP */
#app{display:none}
.hdr{background:var(--az);padding:18px 24px}
.hdri{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.hlogo{height:40px;object-fit:contain}
.htit{color:#fff;font-size:18px;font-weight:700}
.hsub{color:rgba(255,255,255,.6);font-size:11px}
.hnav{display:flex;gap:6px;flex-wrap:wrap}
.nbtn{background:transparent;border:1.5px solid rgba(255,255,255,.2);color:rgba(255,255,255,.75);padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Montserrat',sans-serif}
.nbtn.on{background:var(--am);color:var(--az);border-color:var(--am)}

.wrap{max-width:1200px;margin:0 auto;padding:28px 16px}
.st{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin:22px 0 14px;padding-left:10px;border-left:4px solid var(--azs)}
.vw{display:none}.vw.on{display:block}

.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kcard{background:#fff;border-radius:12px;padding:18px;border:1.5px solid #e3e3ec}
.kval{font-size:26px;font-weight:700;color:var(--az)}
.klabel{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px}

.busca{width:100%;padding:12px 14px;border-radius:8px;border:1.5px solid #ddd;font-size:14px;margin-bottom:18px;font-family:'Open Sans',sans-serif}

.tcard{background:#fff;border-radius:12px;border:1.5px solid #e3e3ec;margin-bottom:12px;overflow:hidden}
.thead{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:12px;flex-wrap:wrap}
.thead:hover{background:#fafbfc}
.tnome{font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:var(--az)}
.tmeta{font-size:11px;color:#888}
.tbar-wrap{width:120px;height:8px;background:#eee;border-radius:4px;overflow:hidden}
.tbar{height:100%;background:var(--azs)}
.tpct{font-size:12px;font-weight:700;color:var(--az);width:38px;text-align:right}
.tbody{display:none;padding:0 18px 16px;border-top:1px solid #f0f0f0}
.tbody.on{display:block}

.turma-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f4f4f4;flex-wrap:wrap;gap:8px}
.turma-row:last-child{border-bottom:none}
.turma-nome{font-weight:600;font-size:13px}
.turma-info{font-size:11px;color:#888}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:9px;font-weight:700;padding:3px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px}
.chip.completo{background:var(--verdebg);color:var(--verde)}
.chip.parcial{background:var(--amarelobg);color:var(--amarelo)}
.chip.pendente{background:var(--vermbg);color:var(--verm)}
.tlink{font-size:11px;color:var(--azs);text-decoration:none;font-weight:600}

.mcard{background:#fff;border-radius:12px;padding:16px 18px;border:1.5px solid #e3e3ec;margin-bottom:10px}
.mcodigo{font-size:10px;font-weight:700;color:var(--azs);letter-spacing:1px}
.mdesc{font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;margin:4px 0}
.mnums{display:flex;gap:18px;margin-top:6px}
.mnum{font-size:12px;color:#666}
.mnum b{color:var(--az)}
.mobs{font-size:11px;color:#999;margin-top:6px;font-style:italic}

.pastalink{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fff;border:1.5px solid #e3e3ec;border-radius:8px;margin-bottom:8px;font-size:12px}

@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g6{grid-template-columns:repeat(3,1fr)}.hnav{display:none}}
@media(max-width:480px){.g4{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="pwd">
  <div class="pbox">
    <div class="plogo-chip"><img src="assets/logo-jogando-juntos.png" alt="Jogando Juntos pela Cidadania"></div>
    <div class="psub2">Sistema de Monitoramento Operacional</div>
    <div class="phint">Acesso restrito - Coordenacao Instituto BR Arte</div>
    <input class="pin" type="password" id="pf" placeholder="Senha de acesso"
           onkeydown="if(event.key==='Enter')chkPwd()">
    <button class="pbtn" onclick="chkPwd()">ACESSAR SISTEMA</button>
    <div class="perr" id="perr"></div>
  </div>
  <img class="pfoot-logo" src="assets/logo-instituto-br-arte.png" alt="Instituto BR Arte">
</div>

<div id="ld">
  <div class="spin"></div>
  <div class="ltxt">Carregando dados do projeto...</div>
</div>

<div id="app">
  <header class="hdr">
    <div class="hdri">
      <div style="display:flex;align-items:center;gap:16px">
        <img class="hlogo" src="assets/logo-jogando-juntos.png" alt="Jogando Juntos pela Cidadania">
        <div>
          <div class="hsub">Ministerio do Esporte - Proposta 6050/2024</div>
        </div>
      </div>
      <nav class="hnav">
        <button class="nbtn on" onclick="goV('dashboard')">Dashboard</button>
        <button class="nbtn" onclick="goV('territorios')">Territorios</button>
        <button class="nbtn" onclick="goV('metas')">Metas</button>
        <button class="nbtn" onclick="goV('pastas')">Pastas Drive</button>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <div class="vw on" id="vw-dashboard">
      <div class="st">Visao Geral do Projeto</div>
      <div class="g4" id="kpi-row"></div>
      <div class="st">Evidencia por Tipo</div>
      <div class="g6" id="kpi-evidencia"></div>
    </div>

    <div class="vw" id="vw-territorios">
      <div class="st">Nucleos e Turmas</div>
      <input class="busca" id="busca-territorio" placeholder="Buscar por nucleo, turma ou modalidade..." oninput="renderizarTerritorios()">
      <div id="lista-territorios"></div>
    </div>

    <div class="vw" id="vw-metas">
      <div class="st">Metas do Plano de Trabalho</div>
      <div id="lista-metas"></div>
    </div>

    <div class="vw" id="vw-pastas">
      <div class="st">Pastas de Turma no Drive</div>
      <input class="busca" id="busca-pasta" placeholder="Buscar pasta por nucleo ou turma..." oninput="renderizarPastas()">
      <div id="lista-pastas"></div>
    </div>
  </div>
</div>

<script>
// Trocar pela URL do Web App do Apps Script deste projeto (Code.gs),
// publicada com ?action=api
var API_URL = 'https://script.google.com/macros/s/AKfycbw8n7S_EXYYJAQzWwFWED5iMRXNQ_EXJCmPBErxRmyoL7Frx0HXdQHvmowFOH112RKAdw/exec';
var SENHA_ACESSO = 'Brarte@2026';

var STATUS_KEYS = [
  'Status Fichas Inscricao', 'Status Listas Presenca', 'Status Fotos',
  'Status Videos', 'Status Certificados', 'Status Materiais Didaticos',
  'Status Cards Divulgacao'
];
var STATUS_LABELS = {
  'Status Fichas Inscricao': 'Fichas',
  'Status Listas Presenca': 'Presenca',
  'Status Fotos': 'Fotos',
  'Status Videos': 'Videos',
  'Status Certificados': 'Certificados',
  'Status Materiais Didaticos': 'Materiais',
  'Status Cards Divulgacao': 'Cards'
};

var DADOS = null;

function chkPwd() {
  var v = document.getElementById('pf').value;
  if (v === SENHA_ACESSO) {
    document.getElementById('pwd').style.display = 'none';
    carregarDados();
  } else {
    document.getElementById('perr').innerText = 'Senha incorreta.';
  }
}

function carregarDados() {
  document.getElementById('ld').style.display = 'flex';
  fetch(API_URL + '?action=api')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      DADOS = data;
      document.getElementById('ld').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      renderizarDashboard();
      renderizarTerritorios();
      renderizarMetas();
      renderizarPastas();
    })
    .catch(function (err) {
      document.getElementById('ld').style.display = 'none';
      alert('Erro ao carregar dados: ' + err.message);
    });
}

// -------------------------------------------------------------------
// STATUS DA TURMA - Completo so quando as 7 subpastas tem evidencia.
// Pasta vazia nunca conta como executado (regra de ouro).
// -------------------------------------------------------------------
function statusTurma(turma) {
  var vals = STATUS_KEYS.map(function (k) { return turma[k]; });
  var completos = vals.filter(function (v) { return v === 'Completo'; }).length;
  if (completos === vals.length) return 'completo';
  if (completos === 0) return 'pendente';
  return 'parcial';
}

function renderizarDashboard() {
  var turmas = DADOS.atividades;
  var total = turmas.length;
  var completas = turmas.filter(function (t) { return statusTurma(t) === 'completo'; }).length;
  var parciais = turmas.filter(function (t) { return statusTurma(t) === 'parcial'; }).length;
  var pendentes = total - completas - parciais;
  var nucleos = uniq(turmas.map(function (t) { return t.Territorio; })).length;
  var pct = total ? Math.round((completas / total) * 100) : 0;

  document.getElementById('kpi-row').innerHTML =
    kpi(nucleos, 'Nucleos Ativos') +
    kpi(total, 'Turmas Monitoradas') +
    kpi(completas, 'Turmas Completas') +
    kpi(pct + '%', 'Execucao Geral');

  document.getElementById('kpi-evidencia').innerHTML = STATUS_KEYS.map(function (k) {
    var comEvidencia = turmas.filter(function (t) { return t[k] === 'Completo'; }).length;
    var p = total ? Math.round((comEvidencia / total) * 100) : 0;
    return kpi(p + '%', STATUS_LABELS[k]);
  }).join('');
}

function kpi(valor, label) {
  return '<div class="kcard"><div class="kval">' + valor + '</div><div class="klabel">' + label + '</div></div>';
}

function uniq(arr) {
  return arr.filter(function (v, i) { return arr.indexOf(v) === i; });
}

// -------------------------------------------------------------------
// TERRITORIOS - agrupado por nucleo, expande para ver as turmas
// -------------------------------------------------------------------
function renderizarTerritorios() {
  var filtro = (document.getElementById('busca-territorio').value || '').toLowerCase();
  var turmas = DADOS.atividades.filter(function (t) {
    if (!filtro) return true;
    return (t.Nucleo + ' ' + t['Nome Turma'] + ' ' + t['Modalidade Oficial']).toLowerCase().indexOf(filtro) !== -1;
  });

  var porTerritorio = {};
  turmas.forEach(function (t) {
    if (!porTerritorio[t.Territorio]) porTerritorio[t.Territorio] = [];
    porTerritorio[t.Territorio].push(t);
  });

  var territorios = Object.keys(porTerritorio).sort();
  var html = territorios.map(function (terr, idx) {
    var lista = porTerritorio[terr];
    var completas = lista.filter(function (t) { return statusTurma(t) === 'completo'; }).length;
    var pct = lista.length ? Math.round((completas / lista.length) * 100) : 0;
    var id = 'terr-' + idx;

    var linhasTurma = lista.map(function (t) {
      var st = statusTurma(t);
      var chipsHtml = STATUS_KEYS.map(function (k) {
        var v = t[k];
        var cls = v === 'Completo' ? 'completo' : (v === 'Parcial' ? 'parcial' : 'pendente');
        return '<span class="chip ' + cls + '">' + STATUS_LABELS[k] + '</span>';
      }).join('');
      var link = t['Link da Pasta Drive']
        ? '<a class="tlink" href="' + t['Link da Pasta Drive'] + '" target="_blank">Abrir pasta</a>'
        : '<span class="tlink" style="opacity:.4">Sem pasta</span>';
      return '<div class="turma-row">' +
        '<div><div class="turma-nome">' + t['Nome Turma'] + '</div>' +
        '<div class="turma-info">' + t['Modalidade Oficial'] + ' | ' + (t['Dias e Horario'] || '') + '</div></div>' +
        '<div class="chips">' + chipsHtml + '</div>' + link + '</div>';
    }).join('');

    return '<div class="tcard">' +
      '<div class="thead" onclick="toggleTerritorio(\'' + id + '\')">' +
      '<div><div class="tnome">' + terr + '</div><div class="tmeta">' + lista.length + ' turmas</div></div>' +
      '<div style="display:flex;align-items:center;gap:10px">' +
      '<div class="tbar-wrap"><div class="tbar" style="width:' + pct + '%"></div></div>' +
      '<div class="tpct">' + pct + '%</div></div></div>' +
      '<div class="tbody" id="' + id + '">' + linhasTurma + '</div></div>';
  }).join('');

  if (territorios.length === 0) {
    html = '<div class="tmeta">Nenhum resultado para essa busca.</div>';
  }

  var nucleoItauna = 16 - territorios.length;
  document.getElementById('lista-territorios').innerHTML = html;
}

function toggleTerritorio(id) {
  document.getElementById(id).classList.toggle('on');
}

// -------------------------------------------------------------------
// METAS
// -------------------------------------------------------------------
function renderizarMetas() {
  var html = DADOS.metas.map(function (m) {
    return '<div class="mcard">' +
      '<div class="mcodigo">' + m['Codigo Meta'] + '</div>' +
      '<div class="mdesc">' + m['Descricao'] + '</div>' +
      '<div class="mnums">' +
      '<div class="mnum">Previsto: <b>' + (m['Quantidade Prevista'] || '-') + '</b></div>' +
      '<div class="mnum">Realizado: <b>' + (m['Quantidade Realizada'] || '-') + '</b></div>' +
      '</div>' +
      (m['Observacao'] ? '<div class="mobs">' + m['Observacao'] + '</div>' : '') +
      '</div>';
  }).join('');
  document.getElementById('lista-metas').innerHTML = html;
}

// -------------------------------------------------------------------
// PASTAS DRIVE - lista plana de todas as turmas com link direto
// -------------------------------------------------------------------
function renderizarPastas() {
  var filtro = (document.getElementById('busca-pasta').value || '').toLowerCase();
  var turmas = DADOS.atividades.filter(function (t) {
    if (!filtro) return true;
    return (t.Nucleo + ' ' + t['Nome Turma']).toLowerCase().indexOf(filtro) !== -1;
  });

  var html = turmas.map(function (t) {
    var link = t['Link da Pasta Drive']
      ? '<a class="tlink" href="' + t['Link da Pasta Drive'] + '" target="_blank">Abrir no Drive</a>'
      : '<span class="tlink" style="opacity:.4">Sem pasta</span>';
    return '<div class="pastalink"><span>' + t.Nucleo + ' - ' + t['Nome Turma'] + '</span>' + link + '</div>';
  }).join('');

  if (turmas.length === 0) {
    html = '<div class="tmeta">Nenhum resultado para essa busca.</div>';
  }
  document.getElementById('lista-pastas').innerHTML = html;
}

function goV(nome) {
  document.querySelectorAll('.vw').forEach(function (v) { v.classList.remove('on'); });
  document.getElementById('vw-' + nome).classList.add('on');
  document.querySelectorAll('.nbtn').forEach(function (b) { b.classList.remove('on'); });
  event.target.classList.add('on');
}
</script>
</body>
</html>
