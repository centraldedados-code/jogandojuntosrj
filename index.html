<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jogando Juntos | Monitoramento + Galeria por atividade</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap');
:root{--az:#092040;--az2:#021738;--c:#00B7D7;--gold:#ECC203;--bg:#EFF1F3;--p:#fff;--ink:#152638;--soft:#5c6a78;--stroke:#dbe2e9;--green:#197749;--amber:#946200}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Open Sans',Arial,sans-serif;font-size:13px}button,input,select{font:inherit}button{cursor:pointer}h1,h2,h3{font-family:Montserrat,Arial,sans-serif;margin:0}a{color:#006d8a}.top{background:var(--az);color:#fff;box-shadow:0 4px 16px #00182724}.top-inner{max-width:1370px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:15px;justify-content:space-between;flex-wrap:wrap}.identity{display:flex;align-items:center;gap:13px}.brand-box{width:45px;height:45px;display:grid;place-items:center;background:var(--gold);color:var(--az);border-radius:12px;font:800 22px Montserrat}.brand-logos{display:flex;align-items:center;gap:8px;flex-shrink:0}.brand-logos img{max-width:124px;height:50px;object-fit:contain;background:white;border-radius:8px;padding:5px 9px}.brand-logos .logo-project{max-width:112px}.brand-logos .logo-institute{max-width:125px}.name{font:800 15px Montserrat;color:var(--gold);letter-spacing:.6px}.subtitle{color:#b3c8d8;font-size:11px;margin-top:4px}.nav{display:flex;gap:3px;max-width:100%;overflow:auto}.nav button{border:0;background:transparent;color:#bacbda;border-radius:8px;padding:10px 12px;white-space:nowrap;font:700 11px Montserrat}.nav button:hover,.nav button.on{color:var(--gold);background:#ffffff13}.wrap{max-width:1370px;margin:0 auto;padding:25px 20px 60px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.heading h1{font-size:23px;color:var(--az)}.heading p{font-size:12px;color:var(--soft);margin:5px 0}.secondary{color:var(--soft)}.tiny{font-size:11px}.view{display:none}.view.on{display:block}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.kpi{background:var(--az);border-radius:13px;padding:20px;min-height:115px}.kpi strong{display:block;font:800 30px Montserrat;color:var(--gold);margin-bottom:10px}.kpi span{color:#b8c6d3;font-size:12px}.section-title{font:800 11px Montserrat;letter-spacing:1.2px;color:var(--az);text-transform:uppercase;border-left:4px solid var(--c);padding-left:10px;margin:25px 0 13px}.card{background:#fff;border:1px solid var(--stroke);border-radius:12px;padding:17px;box-shadow:0 3px 10px #09204007}.notice{padding:14px 17px;border-radius:10px;background:#e8f8fc;border:1px solid #c8eff7;color:#1a556c;line-height:1.6}.warn{background:#fff7e4;border:1px solid #f2e2b2;color:#795516}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.controls select,.controls input{border:1px solid #cbd6df;background:#fff;color:var(--ink);border-radius:9px;padding:10px 12px;min-height:38px;min-width:170px;max-width:100%}.controls input{flex:1;min-width:170px}.btn{border:none;background:var(--az);color:var(--gold);border-radius:8px;padding:10px 14px;font:700 11px Montserrat;cursor:pointer}.btn:hover{background:#036f87;color:white}.btn.secondary{background:#f0f5f8;color:var(--az);border:1px solid var(--stroke)}.btn:disabled{opacity:.35;cursor:not-allowed}.pill{font:700 10px Montserrat;padding:4px 9px;background:#edf2f7;color:#315066;border-radius:99px;display:inline-block}.pill.ok{color:#206344;background:#e7f6ed}.pill.attn{color:#8a6000;background:#fff5d9}.pill.danger{color:#a22f30;background:#ffeaea}.table-wrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th{background:var(--az);color:#fff;text-align:left;font:700 10px Montserrat;text-transform:uppercase;padding:12px;white-space:nowrap}.tbl td{padding:12px;border-bottom:1px solid #e8edf0;vertical-align:middle}.tbl tbody tr:hover{background:#f8fbfc}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.item{background:white;border:1px solid var(--stroke);border-radius:11px;padding:15px;transition:transform .14s,border .14s}.item:hover{transform:translateY(-2px);border-color:var(--c)}.item h3{font-size:13px;color:var(--az);line-height:1.4;margin:8px 0}.item .caption{font-size:11px;color:var(--soft);line-height:1.6}.counts{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.counts span{padding:4px 7px;background:#edf4f8;color:var(--az);border-radius:6px;font-size:10px;font-weight:bold}.item .btn{margin-top:6px}.filters-title{font:700 12px Montserrat;color:var(--az);margin-bottom:8px}.empty{padding:35px;text-align:center;color:var(--soft);border:1px dashed #cbd3de;background:#fff;border-radius:12px}.statusline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px;margin-bottom:20px;border:1px solid var(--stroke);background:#fff;border-radius:12px}.line{height:8px;border-radius:20px;background:#dce4ec;overflow:hidden}.progress{height:100%;background:var(--c)}.modal{position:fixed;inset:0;background:#051d33b8;z-index:900;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:4vh 15px}.modal.on{display:flex}.modal-box{width:min(1180px,100%);background:var(--bg);border-radius:16px;overflow:hidden;box-shadow:0 20px 70px #0007}.modal-head{background:var(--az);color:white;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h2{font-size:16px;color:var(--gold);margin-bottom:5px}.modal-head small{color:#acc5d5}.x{background:transparent;border:0;color:white;font-size:25px;cursor:pointer}.modal-body{padding:18px}.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}.subtabs button{border:1px solid #cedbe4;background:#fff;border-radius:9px;padding:9px 12px;color:var(--az);font:700 10px Montserrat}.subtabs button.on{background:var(--az);color:var(--gold)}.media-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.media{background:white;border:1px solid #dfe6ee;border-radius:10px;overflow:hidden}.media .preview{height:145px;background:#e7eef3;display:grid;place-items:center;position:relative;cursor:pointer}.preview img{width:100%;height:100%;object-fit:cover}.preview .file-icon{font:800 38px Montserrat;color:var(--az)}.media .body{padding:10px;overflow:hidden}.media .fname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--az)}.media .detail{font-size:10px;color:var(--soft);margin:6px 0;overflow-wrap:anywhere}.media a{font-size:10px;margin-right:8px}.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:17px}.preview-layer{position:fixed;inset:0;background:#071624ec;z-index:2000;display:none;flex-direction:column;padding:15px;align-items:center}.preview-layer.on{display:flex}.preview-layer .preview-nav{width:min(1100px,100%);display:flex;justify-content:space-between;align-items:center;color:white;gap:10px;margin-bottom:10px}.preview-layer iframe{width:min(1100px,100%);height:85vh;border:0;border-radius:10px;background:white}.preview-layer img{max-height:85vh;max-width:100%;object-fit:contain}.spin{margin:50px auto;width:38px;height:38px;border:4px solid #d5ebef;border-top-color:var(--c);border-radius:50%;animation:rotate .7s linear infinite}@keyframes rotate{to{transform:rotate(360deg)}}.footer{margin-top:35px;background:var(--az);color:#b1c2d4;padding:15px 20px;border-radius:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px}.loading{font-size:14px;padding:65px;text-align:center;color:var(--az)}.loading .spin{margin:0 auto 16px}
@media(max-width:1050px){.cards,.grid4,.media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.brand-logos img{height:41px;max-width:90px;padding:4px 6px}.brand-logos .logo-project,.brand-logos .logo-institute{max-width:90px}.name{font-size:12px}.wrap{padding:16px 12px 40px}.cards,.grid3,.grid4,.media-grid{grid-template-columns:1fr}.heading h1{font-size:20px}.controls select,.controls input{min-width:100%}.modal{padding:5px}.modal-body{padding:10px}.top-inner{padding:12px}.statusline{align-items:stretch}}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
<div class="identity"><div class="brand-logos"><img class="logo-project" src="assets/logo-jogando-juntos.png" alt="Logomarca do projeto Jogando Juntos pela Cidadania"><img class="logo-institute" src="assets/logo-instituto-br-arte.png" alt="Logomarca do Instituto BR Arte"></div><div><div class="name">JOGANDO JUNTOS PELA CIDADANIA</div><div class="subtitle">Sistema de Monitoramento e Prestação de Contas • Instituto BR Arte</div></div></div>
<nav class="nav" aria-label="Menu principal">
<button class="on" data-view="dashboard">Dashboard</button><button data-view="atividades">Atividades</button><button data-view="nucleos">Núcleos</button><button data-view="galeria">Galeria de Evidências</button><button data-view="metas">Metas</button><button data-view="pendencias">Pendências</button><button data-view="drive">Drive</button>
</nav></div></header>
<div class="wrap" id="main"><div class="loading"><div class="spin"></div>Conectando à planilha oficial do projeto...</div></div>
<div class="modal" id="fichaModal" role="dialog" aria-modal="true" aria-label="Ficha de evidência"><div class="modal-box">
<div class="modal-head"><div><h2 id="fichaTitle">Ficha de Evidência</h2><small id="fichaSub"></small></div><button class="x" id="closeFicha" title="Fechar">×</button></div>
<div class="modal-body"><div class="notice" id="fichaInfo"></div><div class="section-title">Documentos vinculados</div><div class="subtabs" id="fichaTipos"></div><div id="listaArquivos"></div><div id="fichaPager" class="pager"></div></div></div></div>
<div class="preview-layer" id="previewLayer"><div class="preview-nav"><span id="previewName"></span><button class="btn" id="closePreview">Fechar visualização ×</button></div><div id="previewContent"></div></div>
<script>
'use strict';
var D=null,P={view:'dashboard',territorio:'',busca:'',tipo:'TODOS',somenteComArquivos:true},F={id:'',tipo:'TODOS',pagina:1},lastItems=[];
var TIPOS=[['TODOS','Todos'],['FOTO','Fotos'],['LISTA_PRESENCA','Listas de presença'],['DIARIO_DE_CLASSE','Diários de classe'],['FOLHA_DE_PONTO','Folhas de ponto'],['RELATORIO','Relatórios'],['FICHA_INSCRICAO','Inscrições'],['VIDEO','Vídeos'],['DECLARACAO','Declarações'],['CERTIFICADO','Certificados'],['TERMO','Termos'],['OUTRO_DOCUMENTO','Outros documentos'],['TIPO_NAO_IDENTIFICADO','Não identificados'],['MATERIAL_AUXILIAR','Materiais auxiliares']];
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x];});}
function low(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function url(u){return /^https:\/\/(drive|docs)\.google\.com\//.test(String(u||''))?e(u):'';}
// URL do Web App existente: ao ATUALIZAR a implantação, esta URL continua igual.
// Se criar uma NOVA implantação, substitua pela nova URL /exec.
var API_URL='https://script.google.com/macros/s/AKfycbw8n7S_EXYYJAQzWwFWED5iMRXNQ_EXJCmPBErxRmyoL7Frx0HXdQHvmowFOH112RKAdw/exec';
var _seq=0;
function call(name,args,ok,err){
  var actions={jjResumoPainel:'jj_resumo',jjArquivosDaFicha:'jj_arquivos'};
  var action=actions[name];
  if(!action){(err||error)('Consulta indisponível.');return;}
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(API_URL)){
    (err||error)('Configure a URL /exec do Apps Script no index.html.');return;
  }
  var callback='jjcb_'+Date.now()+'_'+(++_seq);
  var params=new URLSearchParams({action:action,callback:callback});
  if(name==='jjArquivosDaFicha'){
    params.set('ficha',args[0]||'');params.set('tipo',args[1]||'TODOS');params.set('pagina',String(args[2]||1));
  }
  var script=document.createElement('script'),finished=false,timer;
  function cleanup(){if(finished)return;finished=true;clearTimeout(timer);delete window[callback];script.remove();}
  window[callback]=function(payload){cleanup();if(payload&&payload.erro){(err||error)(payload.erro);}else ok(payload);};
  script.onerror=function(){cleanup();(err||error)('Falha ao consultar a API do Apps Script. Confira a implantação.');};
  timer=setTimeout(function(){cleanup();(err||error)('A API demorou para responder. Tente Atualizar dados.');},25000);
  script.src=API_URL+'?'+params.toString();document.head.appendChild(script);
}

function error(err){var msg=String(err&&err.message||err);document.getElementById('main').innerHTML='<div class="notice warn">Não foi possível carregar o painel: '+e(msg)+'. Confira o acesso Google, a instalação do módulo e os registros de execução.</div>';}
function kpi(val,label){return '<div class="kpi"><strong>'+e(val)+'</strong><span>'+e(label)+'</span></div>';}
function tag(t,c){return '<span class="pill '+(c||'')+'">'+e(t)+'</span>';}
function H(t,sub){return '<div class="heading"><div><h1>'+e(t)+'</h1><p>'+e(sub||'')+'</p></div><div class="tiny secondary">Atualizado: '+e(D&&D.gerado||'—')+'</div></div>';}
function block(title,text){return '<div class="section-title">'+e(title)+'</div>'+(text||'');}
function territories(){return [...new Set((D.turmas||[]).map(x=>x.territorio))].sort((a,b)=>a.localeCompare(b,'pt-BR'));}
function territorySelect(id,val){return '<select id="'+id+'"><option value="">Todos os núcleos</option>'+territories().map(x=>'<option '+(x===val?'selected':'')+' value="'+e(x)+'">'+e(x)+'</option>').join('')+'</select>';}
function records(){return (D.fichas||[]).filter(x=>(!P.territorio||x.territorio===P.territorio)&&(!P.busca||low(x.turma+' '+x.territorio+' '+x.modalidade).includes(low(P.busca)))&&(!P.somenteComArquivos||x.total>0));}
function filaNotice(){var f=D.fila||{},pct=f.pastasTotal?Math.round(f.concluidas/f.pastasTotal*100):0;return '<div class="statusline"><div style="flex:1;min-width:240px"><strong>Inventário do Drive: '+e(f.concluidas)+' / '+e(f.pastasTotal)+' pastas concluídas</strong><div class="tiny secondary" style="margin:6px 0">'+e(f.pendentes)+' pendentes • '+e(f.erros)+' com erro de leitura. A galeria se completa à medida que a varredura avança.</div><div class="line"><div class="progress" style="width:'+pct+'%"></div></div></div><button class="btn" id="refresh">Atualizar dados</button></div>';}
function shell(view,content){document.getElementById('main').innerHTML=content+'<footer class="footer"><span>Instituto BR Arte • Jogando Juntos pela Cidadania</span><span>Metadados e comprovação documental são conceitos diferentes. Arquivos individuais respeitam as permissões do Drive.</span></footer>';document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.view===view));var b=document.getElementById('refresh');if(b)b.onclick=refresh;}
function refresh(){document.getElementById('main').innerHTML='<div class="loading"><div class="spin"></div>Atualizando os dados do monitoramento...</div>';call('jjResumoPainel',[],function(data){D=data;render();});}
function render(){if(!D)return;var fn={dashboard:renderDashboard,atividades:renderAtividades,nucleos:renderNucleos,galeria:renderGaleria,metas:renderMetas,pendencias:renderPendencias,drive:renderDrive};fn[P.view]();}
function renderDashboard(){var c=D.contadores||{},rev=D.fichas.filter(x=>x.turma==='SEM TURMA CONFIRMADA'&&x.total>0).length;
var html=H('Visão Geral do Projeto','Execução registrada, documentação localizada e classificação de evidências')+filaNotice();
html+='<div class="cards">'+kpi(c.nucleos,'Núcleos no planejamento')+kpi(c.turmas,'Turmas cadastradas')+kpi(c.arquivos,'Arquivos inventariados')+kpi(c.fotos,'Fotografias localizadas')+'</div>';
html+=block('Monitoramento por dimensão','<div class="grid3">'+
'<div class="card"><h3>Execução informada</h3><p class="tiny secondary">Situações registradas em ATIVIDADES. Sem conclusão automática a partir das fotos.</p>'+tag(D.turmas.filter(t=>t.diario==='Completo').length+' diários marcados completos')+'</div>'+
'<div class="card"><h3>Comprovação documental</h3><p class="tiny secondary">Arquivos de todos os tipos indexados na pasta do projeto e no log existente.</p>'+tag(c.listas+' lista(s) de presença')+'</div>'+
'<div class="card"><h3>Confiabilidade dos vínculos</h3><p class="tiny secondary">Fotos e documentos sem turma inequívoca permanecem visíveis, mas separados.</p>'+tag(c.semTurma+' arquivo(s) em revisão','attn')+'</div></div>');
html+=block('Atenção gerencial','<div class="notice warn">'+e(D.aviso)+'<br>Existem '+rev+' grupos de arquivos cuja turma ainda não foi identificada. A contagem de fotos não inclui imagens embutidas dentro de PDFs consolidados.</div>');
shell('dashboard',html);}
function renderAtividades(){var turmas=D.turmas.filter(t=>(!P.territorio||t.territorio===P.territorio)&&(!P.busca||low(t.turma+' '+t.territorio+' '+t.modalidade).includes(low(P.busca))));
var cards=Object.fromEntries(D.fichas.map(x=>[x.id,x]));var html=H('Atividades e Turmas',D.turmas.length+' turmas de referência; situações declaradas na planilha não equivalem à validação de documentos')+filaNotice();
html+='<div class="controls">'+territorySelect('filterT',P.territorio)+'<input id="searchT" placeholder="Buscar turma ou modalidade" value="'+e(P.busca)+'"></div>';
html+='<div class="card table-wrap" style="padding:0"><table class="tbl"><thead><tr><th>Núcleo</th><th>Turma / modalidade</th><th>Diário</th><th>Ponto</th><th>Fotos (declarado)</th><th>Arquivos encontrados</th><th>Acesso</th></tr></thead><tbody>'+turmas.map(t=>{var f=cards[t.id]||{};return '<tr><td>'+e(t.territorio)+'</td><td><strong>'+e(t.turma)+'</strong><br><span class="tiny secondary">'+e(t.modalidade)+' · '+e(t.horario)+'</span></td><td>'+tag(t.diario||'Sem informação',t.diario==='Completo'?'ok':'attn')+'</td><td>'+tag(t.ponto||'Sem informação',t.ponto==='Completo'?'ok':'attn')+'</td><td>'+tag(t.fotos||'Sem informação',t.fotos==='Completo'?'ok':'attn')+'</td><td><strong>'+Number(f.total||0)+'</strong></td><td><button class="btn" data-ficha="'+e(t.id)+'">Ver evidências</button></td></tr>';}).join('')+'</tbody></table></div>';
shell('atividades',html);wireFilters('filterT','searchT');wireFichas();}
function renderNucleos(){var grouped=Object.groupBy?Object.groupBy(D.turmas,t=>t.territorio):{};if(!Object.groupBy)D.turmas.forEach(t=>(grouped[t.territorio]||(grouped[t.territorio]=[])).push(t));
var html=H('Núcleos esportivos','Navegue por território e encontre todas as turmas')+filaNotice();
html+=block(territories().length+' núcleos com turmas cadastradas','<div class="grid4">'+Object.keys(grouped).sort().map(n=>{var t=grouped[n],ids=new Set(t.map(x=>x.id)),f=D.fichas.filter(x=>ids.has(x.id));var total=f.reduce((a,b)=>a+b.total,0);return '<article class="item"><div class="pill">'+e(t.length)+' turmas</div><h3>'+e(n)+'</h3><div class="caption">'+total+' documento(s) inventariados nas respectivas fichas</div><button class="btn" data-nucleo="'+e(n)+'">Ver turmas e evidências</button></article>';}).join('')+'</div>');
shell('nucleos',html);document.querySelectorAll('[data-nucleo]').forEach(b=>b.onclick=function(){P.territorio=b.dataset.nucleo;P.view='galeria';P.somenteComArquivos=false;render();});}
function renderGaleria(){var all=records();
var html=H('Galeria de Evidências','Fotografias, listas, relatórios e documentos, organizados por ficha de atividade')+filaNotice();if(!D.detalhesPublicados)html+='<div class="notice warn" style="margin-bottom:12px">A galeria já contabiliza os arquivos. A exibição pública de fotografias e documentos individuais permanece desativada até autorização institucional, pois o GitHub Pages não restringe visitantes.</div>';
html+='<div class="controls">'+territorySelect('filterT',P.territorio)+'<input id="searchT" placeholder="Pesquisar turma, modalidade ou núcleo" value="'+e(P.busca)+'"><label class="tiny"><input type="checkbox" id="hasFiles" '+(P.somenteComArquivos?'checked':'')+'> Somente fichas com arquivos</label></div>';
html+='<div class="tiny secondary" style="margin-bottom:10px">'+all.length+' ficha(s) no filtro atual. Arquivos sem turma também possuem fichas próprias de revisão.</div>';
html+=(all.length?'<div class="grid3">'+all.map(f=>'<article class="item"><span class="pill '+(f.turma==='SEM TURMA CONFIRMADA'?'attn':'')+'">'+(f.turma==='SEM TURMA CONFIRMADA'?'Vínculo em revisão':e(f.id))+'</span><h3>'+e(f.turma)+' · '+e(f.territorio||'Território não identificado')+'</h3><div class="caption">'+e(f.modalidade||'Modalidade a confirmar')+'</div><div class="counts"><span>'+f.fotos+' fotos</span><span>'+f.listas+' listas</span><span>'+f.diarios+' diários</span><span>'+f.relatorios+' relatórios</span><span>'+f.total+' arquivos</span></div><button class="btn" data-ficha="'+e(f.id)+'">Abrir ficha</button></article>').join('')+'</div>':'<div class="empty">Nenhuma ficha corresponde a estes filtros. Verifique também a situação da varredura.</div>');
shell('galeria',html);wireFilters('filterT','searchT');wireFichas();document.getElementById('hasFiles').onchange=ev=>{P.somenteComArquivos=ev.target.checked;render();};}
function renderMetas(){var html=H('Metas e indicadores','Números do planejamento oficial, sem presumir metas realizadas')+filaNotice();html+=block('Metas do instrumento','<div class="grid3">'+D.metas.map(m=>'<div class="item"><span class="pill">'+e(m.codigo)+'</span><h3>'+e(m.descricao)+'</h3><p class="caption">Previsto: <strong>'+e(m.previsto||'Não quantificado')+'</strong><br>Realizado informado: <strong>'+e(m.realizado||'Não preenchido')+'</strong></p><p class="tiny secondary">'+e(m.obs||'')+'</p></div>').join('')+'</div>');shell('metas',html);}
function renderPendencias(){var pend=[];D.turmas.forEach(t=>{var a=[];if(t.diario==='Pendente')a.push('Diário de classe');if(t.ponto==='Pendente')a.push('Folha de ponto');if(t.fotos==='Pendente')a.push('Fotografias');if(t.videos==='Pendente')a.push('Vídeos');if(a.length)pend.push({id:t.id,territorio:t.territorio,turma:t.turma,itens:a});});
var html=H('Pendências e Verificações','Pendências informadas na planilha e documentos sem classificação definitiva')+filaNotice();
html+='<div class="notice warn">O rótulo “Pendente” abaixo é o registro atual da planilha, não prova de que a atividade não ocorreu. Confira cada ficha e a existência de documentação física ou digital.</div>';
html+=block('Pendências por turma','<div class="card table-wrap" style="padding:0"><table class="tbl"><tr><th>Núcleo</th><th>Turma</th><th>Itens pendentes na planilha</th><th>Consultar</th></tr>'+pend.map(t=>'<tr><td>'+e(t.territorio)+'</td><td>'+e(t.turma)+'</td><td>'+t.itens.map(x=>tag(x,'attn')).join(' ')+'</td><td><button class="btn" data-ficha="'+e(t.id)+'">Abrir ficha</button></td></tr>').join('')+'</table></div>');
html+=block('Arquivos ainda sem turma definida','<div class="grid3">'+D.fichas.filter(x=>x.turma==='SEM TURMA CONFIRMADA'&&x.total).map(f=>'<div class="item"><h3>'+e(f.territorio||'Sem território')+'</h3><div class="counts"><span>'+f.total+' arquivos</span><span>'+f.fotos+' fotos</span></div><button class="btn" data-ficha="'+e(f.id)+'">Revisar documentos</button></div>').join('')+'</div>');
shell('pendencias',html);wireFichas();}
function renderDrive(){var html=H('Pastas e Estrutura do Drive','Acesso às fontes originais sem mover, renomear ou apagar arquivos')+filaNotice();html+='<div class="notice">A galeria indexa as pastas das 174 turmas, áreas de classificação/revisão e anexos consolidados encontrados durante a varredura. PDFs contendo fotografias incorporadas aparecem como PDFs; a extração de imagens internas exigiria processamento complementar.</div>';
html+=block('Acesso à pasta raiz','<div class="card"><a href="https://drive.google.com/drive/folders/1bJlN6caRRxZguyAX2BmH12l18P9Y7_c8" target="_blank" rel="noopener" class="btn" style="display:inline-block;text-decoration:none">Abrir Drive do Jogando Juntos ↗</a></div>');
html+=block('Pastas das turmas','<div class="controls">'+territorySelect('filterT',P.territorio)+'</div><div class="grid4">'+D.turmas.filter(t=>!P.territorio||t.territorio===P.territorio).map(t=>'<article class="item"><span class="pill">'+e(t.territorio)+'</span><h3>'+e(t.turma)+'</h3><a href="'+url(t.url)+'" target="_blank" rel="noopener">Abrir pasta original ↗</a></article>').join('')+'</div>');
shell('drive',html);wireFilters('filterT');}
function wireFilters(tid,qid){var s=document.getElementById(tid);if(s)s.onchange=ev=>{P.territorio=ev.target.value;render();};var q=document.getElementById(qid);if(q){q.onchange=ev=>{P.busca=ev.target.value;render();};q.onkeydown=ev=>{if(ev.key==='Enter'){P.busca=q.value;render();}};}}
function wireFichas(){document.querySelectorAll('[data-ficha]').forEach(b=>b.onclick=()=>abrirFicha(b.dataset.ficha));}
function abrirFicha(id){var f=D.fichas.find(x=>x.id===id),t=D.turmas.find(x=>x.id===id);if(!f&&t)f={...t,total:0,fotos:0,listas:0,relatorios:0};if(!f)return;
F={id:id,tipo:'TODOS',pagina:1};document.getElementById('fichaModal').classList.add('on');document.getElementById('fichaTitle').textContent=f.turma+' · '+(f.territorio||'Território não identificado');document.getElementById('fichaSub').textContent='Ficha '+id+' | '+(f.modalidade||'Modalidade em revisão');
document.getElementById('fichaInfo').innerHTML='<strong>'+e(f.total||0)+' arquivo(s) inventariado(s).</strong> '+e(f.turma==='SEM TURMA CONFIRMADA'?'Vínculo com turma pendente de validação.':'Vínculo pela estrutura de pastas; a comprovação ainda exige conferência.')+'<br><span class="tiny">'+e((t&&t.horario)||'')+'</span>'+(f.url?'<br><a href="'+url(f.url)+'" target="_blank" rel="noopener">Abrir pasta da turma ↗</a>':'');
document.getElementById('fichaTipos').innerHTML=TIPOS.map(([v,label])=>'<button data-tipo="'+v+'" class="'+(v==='TODOS'?'on':'')+'">'+e(label)+'</button>').join('');
document.querySelectorAll('[data-tipo]').forEach(b=>b.onclick=()=>{F.tipo=b.dataset.tipo;F.pagina=1;carregarArquivos();});carregarArquivos();}
function carregarArquivos(){document.querySelectorAll('[data-tipo]').forEach(b=>b.classList.toggle('on',b.dataset.tipo===F.tipo));document.getElementById('listaArquivos').innerHTML='<div class="loading"><div class="spin"></div>Buscando arquivos da ficha...</div>';document.getElementById('fichaPager').innerHTML='';var requested=F.id+'|'+F.tipo+'|'+F.pagina;
call('jjArquivosDaFicha',[F.id,F.tipo,F.pagina],function(data){if(F.id+'|'+F.tipo+'|'+F.pagina!==requested)return;lastItems=data.itens;
if(data.protegido){document.getElementById('listaArquivos').innerHTML='<div class="notice warn">'+e(data.aviso||'Detalhes de evidências não liberados para publicação pública.')+'<p class="tiny">As contagens das fichas e os filtros continuam disponíveis no GitHub. As fotografias e os documentos individuais exigem autorização institucional para publicação aberta.</p></div>';return;}if(!data.total){document.getElementById('listaArquivos').innerHTML='<div class="empty">Não há arquivos indexados nesta categoria. A varredura pode ainda estar em andamento.</div>';return;}
var cards=data.itens.map((a,i)=>{var img=a.tipo==='FOTO',pic=img&&/^[\w-]{8,}$/.test(a.id)?'https://drive.google.com/thumbnail?id='+encodeURIComponent(a.id)+'&sz=w400':'';
return '<article class="media"><div class="preview" data-preview="'+i+'">'+(pic?'<img loading="lazy" src="'+e(pic)+'" alt="Prévia de '+e(a.nome)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><span class="file-icon" style="display:none">◫</span>':'<span class="file-icon">'+(a.tipo==='VIDEO'?'▶':'▣')+'</span>')+'</div><div class="body"><div class="fname" title="'+e(a.nome)+'">'+e(a.nome)+'</div><div class="detail">'+e(a.tipo.replaceAll('_',' '))+'<br>'+e(a.status||a.vinculo||'Conferência documental pendente')+'<br>'+e(a.alterado?'Arquivo alterado: '+a.alterado:'')+'</div><a href="'+url(a.url)+'" target="_blank" rel="noopener">Abrir no Drive ↗</a> <a href="'+url(a.pastaUrl)+'" target="_blank" rel="noopener">Pasta ↗</a></div></article>';}).join('');
document.getElementById('listaArquivos').innerHTML='<div class="media-grid">'+cards+'</div>';
document.querySelectorAll('[data-preview]').forEach(x=>x.onclick=()=>abrirPreview(Number(x.dataset.preview)));
document.getElementById('fichaPager').innerHTML='<span class="tiny secondary">'+data.total+' arquivo(s) · Página '+data.pagina+' de '+data.paginas+'</span><div><button class="btn secondary" id="prev" '+(data.pagina<=1?'disabled':'')+'>Anterior</button> <button class="btn" id="next" '+(data.pagina>=data.paginas?'disabled':'')+'>Próxima</button></div>';
document.getElementById('prev').onclick=()=>{if(F.pagina>1){F.pagina--;carregarArquivos();}};document.getElementById('next').onclick=()=>{if(F.pagina<data.paginas){F.pagina++;carregarArquivos();}};
},function(er){document.getElementById('listaArquivos').innerHTML='<div class="notice warn">Erro na consulta: '+e(er&&er.message||er)+'</div>';});}
function abrirPreview(idx){var a=lastItems[idx];if(!a)return;var img=a.tipo==='FOTO',id=a.id;if(!/^[\w-]{8,}$/.test(id))return;
document.getElementById('previewName').textContent=a.nome;document.getElementById('previewContent').innerHTML=img?'<img alt="'+e(a.nome)+'" src="https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1600">':'<iframe title="Visualização de documento" allowfullscreen src="https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview"></iframe>';
document.getElementById('previewLayer').classList.add('on');}
function fecharPreview(){document.getElementById('previewLayer').classList.remove('on');document.getElementById('previewContent').innerHTML='';}
function fecharFicha(){fecharPreview();document.getElementById('fichaModal').classList.remove('on');}
document.getElementById('closeFicha').onclick=fecharFicha;document.getElementById('closePreview').onclick=fecharPreview;
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){fecharPreview();fecharFicha();}});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{P.view=b.dataset.view;P.busca='';P.territorio='';render();window.scrollTo(0,0);});
refresh();
</script>
</body>
</html>
